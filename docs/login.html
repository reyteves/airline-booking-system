<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Air-Flight Philippines</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #007BFF;
            --bg-light: #F8F9FA;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            height: 100vh;
            overflow: hidden;
        }
        .material-symbols-outlined {
            vertical-align: middle;
        }
        .bg-image {
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCQAQemNS4ie2g1kVRkkM63wYDdbOAQzD3kRAp-mZLZWBaSnVcOVxnHjb56v8JpnfANoVXOmGa0DAkYPgpnq1LIR5lexi4OKPxrk1YdmL4fASTILLbfVJy0aEvjaAz_uA4hNICYTb14HUxvG42DjiOfUAbQ0EX5INBtWlz2654QXr-rkdikpKyZLkNiKO959dx_iwtshtDmScJKqm_PgQCqABnZXp7OE8Im_g_UaB3Qr8WtXFeFEtc83g14sJdX0QtU4eQ6SrLuoZyL');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
        }
        .bg-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.3);
        }
        .form-control {
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
        }
        .btn-primary:hover {
            background-color: #0056b3;
        }
        .social-btn {
            border: 1px solid #dee2e6;
            background: white;
            padding: 0.6rem;
            border-radius: 0.5rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            color: #333;
            transition: background 0.2s;
        }
        .social-btn:hover {
            background: #f8f9fa;
            color: #333;
        }
        /* Mobile adjustments */
        @media (max-width: 991px) {
            body { overflow-y: auto; height: auto; }
            .bg-image { display: none; }
            .login-container { min-height: 100vh; display: flex; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Left Column: Image -->
            <div class="col-lg-6 d-none d-lg-block">
                <div class="bg-image">
                    <div class="bg-overlay"></div>
                    <div class="position-absolute bottom-0 start-0 p-5 text-white">
                        <h2 class="display-4 fw-bold">Welcome Back</h2>
                        <p class="fs-4">Your next adventure awaits.</p>
                    </div>
                </div>
            </div>

            <!-- Right Column: Form -->
            <div class="col-lg-6">
                <div class="login-container p-4 p-lg-5">
                    <div class="w-100" style="max-width: 450px; margin: 0 auto;">
                        <div class="mb-4 text-center text-lg-start">
                            <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-3">
                                <span class="material-symbols-outlined text-primary fs-1">flight_takeoff</span>
                                <span class="fs-3 fw-bold">Air-Flight PH</span>
                            </div>
                            <h1 class="fw-bold">Sign In</h1>
                            <p class="text-secondary">Sign in to continue your journey.</p>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label class="form-label fw-medium">Email</label>
                                <input type="email" class="form-control" placeholder="you@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-medium">Password</label>
                                <div class="input-group">
                                    <input type="password" class="form-control" placeholder="Enter password" required>
                                    <span class="input-group-text bg-white border-start-0 cursor-pointer">
                                        <span class="material-symbols-outlined text-secondary fs-5">visibility_off</span>
                                    </span>
                                </div>
                            </div>
                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="rememberMe">
                                    <label class="form-check-label text-secondary" for="rememberMe">Remember me</label>
                                </div>
                                <a href="#" class="text-primary text-decoration-none fw-medium small">Forgot Password?</a>
                            </div>

                            <button type="button" onclick="window.location.href='home.html'" class="btn btn-primary w-100 mb-4 shadow-sm">Log In</button>
                        </form>

                        <div class="position-relative mb-4">
                            <hr>
                            <span class="position-absolute top-50 start-50 translate-middle bg-light px-2 text-secondary small">or continue with</span>
                        </div>

                        <div class="row g-2 mb-4">
                            <div class="col-6">
                                <a href="#" class="social-btn">
                                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="20" alt="Google">
                                    Google
                                </a>
                            </div>
                            <div class="col-6">
                                <a href="#" class="social-btn">
                                    <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" width="20" alt="Facebook">
                                    Facebook
                                </a>
                            </div>
                        </div>

                        <p class="text-center text-secondary">
                            Don't have an account? <a href="register.html" class="text-primary fw-bold text-decoration-none">Sign Up</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
