<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Air-Flight Philippines</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #007BFF;
            --bg-light: #F8F9FA;
        }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-light);
            height: 100vh;
            overflow: hidden;
        }
        .material-symbols-outlined { vertical-align: middle; }
        .bg-image {
            background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBRQhCWwHNYh99sOZyO4CsxtNQO6kmwYPZldAJAglAg4TEZ0OkSZvLIlWtF7Lr16iRMKr3VCv85At0WZukAvbKCURng9sm7vAG-ZeJ66Oykge-6A6qnjlQcQ4P1WA3dhPHzHMtoN55RWqMTT7ppJFoJqNN82zA9L4zs36Lbe4yqt_2SaG0YrdIuzf-NeKEC6U7Ywx0I8_U4UV1doFyzwFNm1GAX6B4wEr1UzNBmhFRfTsuJ8G479mb7M4ectLekJ4eD-nfLiDk83Y_K');
            background-size: cover;
            background-position: center;
            height: 100vh;
            position: relative;
        }
        .bg-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
        }
        .form-control {
            padding: 0.75rem 1rem 0.75rem 2.5rem; /* Space for icon */
            border-radius: 0.5rem;
        }
        .input-icon {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #6c757d;
            z-index: 10;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.75rem;
            border-radius: 0.5rem;
            font-weight: 700;
        }
        .btn-primary:hover { background-color: #0056b3; }
        
        @media (max-width: 991px) {
            body { overflow-y: auto; height: auto; }
            .bg-image { display: none; }
            .register-container { min-height: 100vh; display: flex; align-items: center; }
        }
    </style>
</head>
<body>
    <div class="container-fluid p-0">
        <div class="row g-0 flex-row-reverse">
            <!-- Right Column: Image -->
            <div class="col-lg-6 d-none d-lg-block">
                <div class="bg-image">
                    <div class="bg-overlay"></div>
                    <div class="position-absolute bottom-0 start-0 p-5 text-white">
                        <h2 class="display-4 fw-bold">Join the Adventure</h2>
                        <p class="fs-4">Experience the beauty of the Philippines.</p>
                    </div>
                </div>
            </div>

            <!-- Left Column: Form -->
            <div class="col-lg-6">
                <div class="register-container p-4 p-lg-5">
                    <div class="w-100" style="max-width: 450px; margin: 0 auto;">
                        <div class="mb-4 text-center text-lg-start">
                            <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-2 mb-3">
                                <span class="material-symbols-outlined text-primary fs-1">flight_takeoff</span>
                                <span class="fs-3 fw-bold">Air-Flight PH</span>
                            </div>
                            <h1 class="fw-bold">Create Account</h1>
                            <p class="text-secondary">Book your next adventure with us.</p>
                        </div>

                        <form id="registerForm">
                            <div class="mb-3 position-relative">
                                <label class="form-label fw-medium">Username</label>
                                <div class="position-relative">
                                    <span class="material-symbols-outlined input-icon">person</span>
                                    <input type="text" class="form-control" placeholder="Enter your username" required>
                                </div>
                            </div>

                            <div class="mb-3 position-relative">
                                <label class="form-label fw-medium">Email</label>
                                <div class="position-relative">
                                    <span class="material-symbols-outlined input-icon">mail</span>
                                    <input type="email" class="form-control" placeholder="Enter your email" required>
                                </div>
                            </div>
                            
                            <div class="mb-4 position-relative">
                                <label class="form-label fw-medium">Password</label>
                                <div class="position-relative">
                                    <span class="material-symbols-outlined input-icon">lock</span>
                                    <input type="password" class="form-control" placeholder="Create a password" required>
                                </div>
                            </div>

                            <button type="button" onclick="window.location.href='home.html'" class="btn btn-primary w-100 mb-4 shadow-sm">Create Account</button>
                        </form>

                        <div class="text-center">
                            <p class="text-secondary">
                                Already have an account? <a href="login.html" class="text-primary fw-bold text-decoration-none">Log In</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
