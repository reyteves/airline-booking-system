<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation - Air-Flight Philippines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        :root { --primary-color: #007BFF; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; padding-top: 70px; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .navbar { background: white; border-bottom: 1px solid #dee2e6; }
        .card { border: none; border-radius: 1.5rem; box-shadow: 0 10px 40px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        .top-bar { height: 6px; background: linear-gradient(90deg, var(--primary-color), #48D1CC); position: absolute; top: 0; left: 0; width: 100%; }
        .success-icon { font-size: 4rem; color: #198754; background: #d1e7dd; padding: 1rem; border-radius: 50%; display: inline-flex; margin-bottom: 1.5rem; }
        .ref-box { background: #f8f9fa; border: 1px dashed #dee2e6; border-radius: 0.5rem; padding: 1.5rem; margin-bottom: 2rem; }
        .btn-primary { background-color: var(--primary-color); border: none; padding: 0.8rem; font-weight: 700; border-radius: 0.5rem; }
        .btn-outline-primary { border-color: var(--primary-color); color: var(--primary-color); padding: 0.8rem; font-weight: 700; border-radius: 0.5rem; }
    </style>
</head>
<body>

    <!-- Navbar (Simplified) -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container justify-content-center">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="home.html">
                <span class="material-symbols-outlined text-primary fs-2">flight_takeoff</span> Air-Flight PH
            </a>
        </div>
    </nav>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card p-5 text-center">
                    <div class="top-bar"></div>
                    <div>
                        <span class="material-symbols-outlined success-icon">check_circle</span>
                    </div>
                    <h2 class="fw-bold mb-2">Booking Confirmed!</h2>
                    <p class="text-muted mb-4">Your flight is all set. A confirmation email has been sent to <strong>user@example.com</strong>.</p>
                    
                    <div class="ref-box">
                        <small class="text-muted text-uppercase fw-bold">Booking Reference</small>
                        <div class="display-6 fw-bold text-primary mt-1">XYZ123</div>
                    </div>

                    <div class="d-grid gap-3">
                        <button onclick="window.location.href='my-bookings.html'" class="btn btn-primary shadow-sm">View My Bookings</button>
                        <button class="btn btn-outline-primary d-flex align-items-center justify-content-center gap-2">
                            <span class="material-symbols-outlined">download</span> Download Itinerary
                        </button>
                    </div>

                    <div class="mt-4">
                        <a href="home.html" class="text-secondary text-decoration-none fw-medium">Back to Home</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
