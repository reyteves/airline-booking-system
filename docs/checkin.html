<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in - Air-Flight Philippines</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">
    <style>
        :root { --primary-color: #007BFF; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; padding-top: 70px; min-height: 100vh; display: flex; flex-direction: column; }
        .navbar { background: white; border-bottom: 1px solid #dee2e6; }
        .main-card { border: none; border-radius: 1rem; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .checkin-img { background: url('https://lh3.googleusercontent.com/aida-public/AB6AXuB9BNW4AqtIaTHjoNCknjYBdaTilfBdXxjWZTz6_qtsQkhDuxfYa_x58Rw_7W9QFRtkYyopzh_yix7z6vm0hte6g6PdXycnsPPeQNj8OTrz4HlEMxWkTmrLrCRGpBlUwtyPUW5pwej7CNHu9AQpaHvCOxyvgALc66C7_jHYU7nUneu1d8bVVgt-KfOhUKOQED-1AAXFGcav88KTHqqp4h0bbRGF7CFy_4I4SkzXN27UYBsGh_GmXL_i4Dyb3tXuZSYqpW_OT1QMIIB4') center/cover; min-height: 300px; position: relative; }
        .img-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.7), transparent); }
        .btn-primary { background-color: var(--primary-color); border: none; padding: 1rem; font-weight: 700; border-radius: 0.5rem; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="home.html">
                <span class="material-symbols-outlined text-primary fs-2">flight_takeoff</span> Air-Flight PH
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link" href="home.html">Book</a></li>
                    <li class="nav-item"><a class="nav-link" href="my-bookings.html">My Bookings</a></li>
                    <li class="nav-item"><a class="nav-link active text-primary fw-bold" href="checkin.html">Check-in</a></li>
                    <li class="nav-item"><a class="nav-link" href="flight-status.html">Flight Status</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item ms-lg-3">
                        <a href="login.html" class="btn btn-light rounded-circle p-2 d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;">
                            <span class="material-symbols-outlined text-secondary">account_circle</span>
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card main-card w-100" style="max-width: 900px;">
            <div class="row g-0">
                <div class="col-md-5 checkin-img">
                    <div class="img-overlay p-4 d-flex flex-column justify-content-end text-white h-100">
                        <div class="text-uppercase fw-bold small text-info mb-1">Upcoming Trip</div>
                        <h3 class="fw-bold">Manila to Cebu</h3>
                        <p class="mb-0 opacity-75">Oct 26, 08:45 AM</p>
                    </div>
                </div>
                <div class="col-md-7 p-4 p-md-5 d-flex flex-column justify-content-center">
                    <h2 class="fw-bold mb-4">Check-in for Your Flight</h2>
                    
                    <div class="bg-light p-3 rounded border mb-4">
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted small fw-bold">Passenger</span>
                            <span class="fw-bold">Juan Dela Cruz</span>
                        </div>
                        <div class="d-flex justify-content-between">
                            <span class="text-muted small fw-bold">Flight</span>
                            <span class="fw-bold">AFP 182</span>
                        </div>
                    </div>

                    <div class="mb-4">
                        <div class="d-flex justify-content-between small fw-bold mb-2">
                            <span>Step 1 of 4</span>
                            <span class="text-primary">25%</span>
                        </div>
                        <div class="progress" style="height: 10px;">
                            <div class="progress-bar bg-primary" role="progressbar" style="width: 25%"></div>
                        </div>
                    </div>

                    <button class="btn btn-primary w-100 shadow-sm">Check-in Now</button>
                    <p class="text-center text-muted small mt-3">Online check-in closes 1 hour before departure.</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
